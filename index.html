<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="2進数 ⇔ 10進数 変換ツール 相互の変換ができます 符号付き対応" />
    <title>2進数 ⇔ 10進数 変換ツール</title>

    <link
        href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;900&family=Roboto+Mono:wght@500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <header>
        <h1>2進数 ⇔ 10進数</h1>
        <div class="header-hiragana">にしんすう ⇔ じゅっしんすう</div>
        <div class="header-sub">Binary ⇔ Decimal</div>
    </header>

    <div class="mode-select-container">
        <select id="themeSelect" aria-label="テーマ選択 / Select Theme">
            <option value="light">ライト (らいと) / Light Mode</option>
            <option value="dark">ダーク (だーく) / Dark Mode</option>
            <option value="system" selected>端末の設定 (たんまつのせってい) / Device Settings</option>
        </select>
    </div>

    <nav class="tab-nav">
        <button id="tabBin" class="active">
            <div>2進数 → 10進数</div>
            <div class="tab-hiragana">にしんすう → じゅっしんすう</div>
            <div>Binary to Decimal</div>
        </button>

        <button id="tabDec">
            <div>10進数 → 2進数</div>
            <div class="tab-hiragana">じゅっしんすう → にしんすう</div>
            <div>Decimal to Binary</div>
        </button>
    </nav>

    <main>
        <div id="panelBin">
            <div class="input-section">
                <div class="label-box">
                    <span class="label-main">2進数</span>
                    <span class="label-hiragana">にしんすう</span>
                    <span class="label-sub">Binary (Base 2)</span>
                </div>
                <input type="text" id="inBin" placeholder="0000" inputmode="numeric" autocomplete="off" />
            </div>

            <div class="result-section">
                <div class="result-label">
                    <span class="label-main">10進数の結果</span>
                    <span class="label-hiragana">じゅっしんすうのけっか</span>
                    <span class="label-sub">Decimal Result</span>
                </div>
                <div id="outBin" class="result-value">-</div>
            </div>
        </div>

        <div id="panelDec">
            <div class="input-section">
                <div class="label-box">
                    <span class="label-main">10進数</span>
                    <span class="label-hiragana">じゅっしんすう</span>
                    <span class="label-sub">Decimal (Base 10)</span>
                </div>
                <input type="text" id="inDec" placeholder="0" inputmode="numeric" autocomplete="off" />
            </div>

            <div class="result-section">
                <div class="result-label">
                    <span class="label-main">2進数の結果</span>
                    <span class="label-hiragana">にしんすうのけっか</span>
                    <span class="label-sub">Binary Result</span>
                </div>
                <div id="outDec" class="result-value">-</div>
            </div>
        </div>
    </main>

    <footer>
        <div id="footer-copy" class="footer-copy">
            &copy; 2025 Binary &harr; Decimal Converter
        </div>
    </footer>
    <script src="script.js" defer></script>
</body>

</html>
